# Decap CMS (Formerly Netlify CMS) Configuration
# File Location: /admin/config.yml

backend:
  name: git-gateway
  branch: main # Change to your target branch (e.g., main or master)

local_backend:
  url: http://localhost:8082/api/v1

# Media & Storage Settings
media_folder: "assets/images/uploads" # Folder where uploaded images are saved
public_folder: "/assets/images/uploads" # Public URL path for images

# CMS Collections Configuration
collections:
  
  # ==========================================
  # HERO SECTION (top of page: headline, stats, photo)
  # ==========================================
  - name: "hero"
    label: "Hero Section (Top of Page)"
    delete: false
    editor:
      preview: false
    files:
      - file: "content/hero.json"
        label: "Hero Section"
        name: "hero"
        fields:
          - { label: "Background Color - Top", name: "background_top", widget: "color", allowInput: true, required: false, default: "#FDFBF7" }
          - { label: "Background Color - Bottom", name: "background_bottom", widget: "color", allowInput: true, required: false, default: "#F4F7F4" }
          - { label: "Show Badge Above Headline", name: "show_badge", widget: "boolean", default: true }
          - { label: "Badge Icon (FontAwesome class)", name: "badge_icon", widget: "string", required: false, default: "fa-solid fa-sparkles", hint: "Browse icons at fontawesome.com/icons, e.g. fa-solid fa-paw" }
          - { label: "Badge Text", name: "badge_text", widget: "string", required: false, default: "Certified Stress-Free Pet Spa" }
          - { label: "Badge Background Color", name: "badge_bg_color", widget: "color", allowInput: true, required: false, default: "#E3EBE3" }
          - { label: "Badge Text Color", name: "badge_text_color", widget: "color", allowInput: true, required: false, default: "#4C684C" }
          - { label: "Badge Icon Color", name: "badge_icon_color", widget: "color", allowInput: true, required: false, default: "#F4A261" }
          - { label: "Headline", name: "title", widget: "string", default: "Gentle Care & Premium Pampering for Your Best Friend." }
          - { label: "Headline Color", name: "title_color", widget: "color", allowInput: true, required: false, default: "#5C3D2E" }
          - { label: "Subtitle", name: "subtitle", widget: "text", default: "At Paws & Suds, we offer low-stress, organic grooming tailored to your dog's unique needs." }
          - { label: "Subtitle Color", name: "subtitle_color", widget: "color", allowInput: true, required: false, default: "#57534E" }
          - { label: "Main Button Text", name: "primary_button_text", widget: "string", default: "Book Your Dog's Visit" }
          - { label: "Main Button Color (empty = brand color)", name: "primary_button_color", widget: "color", allowInput: true, required: false }
          - { label: "Main Button Text Color", name: "primary_button_text_color", widget: "color", allowInput: true, required: false, default: "#FFFFFF" }
          - { label: "Second Button Text", name: "secondary_button_text", widget: "string", default: "Estimate Groom Price" }
          - { label: "Second Button Link (#section or full URL)", name: "secondary_button_link", widget: "string", default: "#estimator" }
          - { label: "Second Button Color", name: "secondary_button_color", widget: "color", allowInput: true, required: false, default: "#FFFFFF" }
          - { label: "Second Button Text Color", name: "secondary_button_text_color", widget: "color", allowInput: true, required: false, default: "#5C3D2E" }
          - { label: "Stat Label Color", name: "stat_label_color", widget: "color", allowInput: true, required: false, default: "#78716C" }
          - label: "Highlight Stats (up to 4)"
            name: "stats"
            widget: "list"
            max: 4
            required: false
            summary: "{{fields.value}} {{fields.label}}"
            fields:
              - { label: "Big Text (e.g. 100% or 10+ Yrs)", name: "value", widget: "string" }
              - { label: "Small Text Underneath", name: "label", widget: "string" }
              - { label: "Big Text Color", name: "value_color", widget: "color", allowInput: true, required: false }
              - { label: "Icon After Big Text (FontAwesome class, optional)", name: "icon", widget: "string", required: false }
              - { label: "Icon Color", name: "icon_color", widget: "color", allowInput: true, required: false }
          - { label: "Hero Photo", name: "image", widget: "image", required: false }
          - { label: "Photo Description (for accessibility)", name: "image_alt", widget: "string", required: false, default: "Happy freshly groomed dog" }
          - { label: "Photo Border Color", name: "image_border_color", widget: "color", allowInput: true, required: false, default: "#FFFFFF" }
          - label: "Floating Card - Bottom Left"
            name: "card_1"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Show Card", name: "show", widget: "boolean", default: true }
              - { label: "Icon (FontAwesome class)", name: "icon", widget: "string", default: "fa-solid fa-heart" }
              - { label: "Icon Color", name: "icon_color", widget: "color", allowInput: true, required: false, default: "#E76F51" }
              - { label: "Icon Background Color", name: "icon_bg_color", widget: "color", allowInput: true, required: false, default: "#F5E2B8" }
              - { label: "Small Text", name: "label", widget: "string", default: "Handling Style" }
              - { label: "Bold Text", name: "text", widget: "string", default: "1-on-1 Gentle Touch" }
          - label: "Floating Card - Top Right"
            name: "card_2"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Show Card", name: "show", widget: "boolean", default: true }
              - { label: "Icon (FontAwesome class)", name: "icon", widget: "string", default: "fa-solid fa-shield-dog" }
              - { label: "Icon Color", name: "icon_color", widget: "color", allowInput: true, required: false, default: "#4C684C" }
              - { label: "Icon Background Color", name: "icon_bg_color", widget: "color", allowInput: true, required: false, default: "#DDE6DD" }
              - { label: "Small Text", name: "label", widget: "string", default: "Safety First" }
              - { label: "Bold Text", name: "text", widget: "string", default: "Sanitized Private Suites" }

  # ==========================================
  # BOOKING SCHEDULE
  # ==========================================
  - name: "schedule"
    label: "Booking Schedule"
    delete: false
    editor:
      preview: false
    files:
      - file: "content/schedule.json"
        label: "Open Days, Times & Days Off"
        name: "schedule"
        fields:
          - { label: "Time Zone (e.g. America/Denver)", name: "timezone", widget: "string", default: "America/Denver" }
          - { label: "Days We Take Appointments", name: "open_days", widget: "select", multiple: true, options: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"], default: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"] }
          - { label: "Appointment Times (exactly like 09:00 AM)", name: "time_slots", widget: "list", field: { label: "Time", name: "time", widget: "string" }, default: ["09:00 AM", "11:00 AM", "01:30 PM", "03:30 PM"] }
          - { label: "Appointments Allowed Per Time Slot", name: "max_per_slot", widget: "number", value_type: "int", min: 1, default: 1 }
          - { label: "Minimum Days Notice (1 = no same-day booking)", name: "min_notice_days", widget: "number", value_type: "int", min: 0, default: 1 }
          - { label: "How Many Days Ahead Customers Can Book", name: "days_ahead", widget: "number", value_type: "int", min: 1, default: 60 }
          - { label: "Days Off / Holidays (whole day closed)", name: "days_off", widget: "list", required: false, field: { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" } }
          - label: "Close Specific Times"
            name: "blocked_slots"
            widget: "list"
            required: false
            summary: "{{fields.date}} {{fields.time}}"
            fields:
              - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
              - { label: "Time (exactly like 09:00 AM)", name: "time", widget: "string" }

  # ==========================================
  # 1. GLOBAL SITE SETTINGS & HERO
  # ==========================================
  - name: "settings"
    label: "Global Site Settings"
    delete: false
    editor:
      preview: false
    files:
      - file: "content/settings.json"
        label: "Business Details & Hero Banner"
        name: "general"
        fields:
          - { label: "Business Name", name: "site_name", widget: "string", default: "Paws & Suds Grooming Spa" }
          - { label: "Brand Color (buttons, logo, accents)", name: "brand_color", widget: "color", allowInput: true, required: false, default: "#7E9F7E" }
          - label: "Top Heading Banner (Logo & Menu)"
            name: "header"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Logo Image (leave empty to use the icon)", name: "logo_image", widget: "image", required: false }
              - { label: "Logo Icon (FontAwesome class, used when no image)", name: "logo_icon", widget: "string", required: false, default: "fa-solid fa-paw" }
              - { label: "Logo Name", name: "logo_text", widget: "string", default: "Paws & Suds" }
              - { label: "Logo Tagline", name: "logo_tagline", widget: "string", required: false, default: "Grooming Spa" }
              - { label: "Booking Button Text", name: "header_button_text", widget: "string", default: "Book Appointment" }
              - label: "Menu Links"
                name: "nav_links"
                widget: "list"
                summary: "{{fields.label}} → {{fields.link}}"
                fields:
                  - { label: "Link Text", name: "label", widget: "string" }
                  - { label: "Section (e.g. #services, #gallery)", name: "link", widget: "string" }
          - { label: "Phone Number (also shown in footer unless the footer has its own)", name: "phone", widget: "string", default: "(555) 019-2834" }

  # ==========================================
  # FOOTER (colors, brand, social media, hours, contact, legal links)
  # ==========================================
  - name: "footer"
    label: "Footer"
    delete: false
    editor:
      preview: false
    files:
      - file: "content/footer.json"
        label: "Footer"
        name: "footer"
        fields:
          - { label: "Background Color", name: "bg_color", widget: "color", allowInput: true, required: false, default: "#5C3D2E" }
          - { label: "Text Color", name: "text_color", widget: "color", allowInput: true, required: false, default: "#F9F5EC" }
          - { label: "Heading Color (brand name, column titles, hours)", name: "heading_color", widget: "color", allowInput: true, required: false, default: "#FFFFFF" }
          - { label: "Accent Color (contact icons, highlighted hours)", name: "accent_color", widget: "color", allowInput: true, required: false, default: "#E9C46A" }
          - { label: "Divider Line Color", name: "divider_color", widget: "color", allowInput: true, required: false, default: "#7F5539" }
          - { label: "Logo Image (leave empty to use the icon)", name: "logo_image", widget: "image", required: false }
          - { label: "Logo Icon (FontAwesome class)", name: "logo_icon", widget: "string", required: false, default: "fa-solid fa-paw" }
          - { label: "Logo Icon Color", name: "logo_icon_color", widget: "color", allowInput: true, required: false, default: "#FFFFFF" }
          - { label: "Logo Box Color (empty = brand color)", name: "logo_bg_color", widget: "color", allowInput: true, required: false }
          - { label: "Brand Name (empty = logo name from Global Site Settings)", name: "brand_name", widget: "string", required: false }
          - { label: "Short Description", name: "description", widget: "text", required: false }
          - { label: "Social Icon Color", name: "social_color", widget: "color", allowInput: true, required: false, default: "#F2EBD9" }
          - label: "Social Media Links"
            name: "social_links"
            widget: "list"
            required: false
            summary: "{{fields.platform}}: {{fields.url}}"
            fields:
              - { label: "Platform", name: "platform", widget: "select", options: ["instagram", "facebook", "tiktok", "youtube", "x", "pinterest", "linkedin", "yelp", "google"] }
              - { label: "Link (full URL, e.g. https://instagram.com/yourpage)", name: "url", widget: "string" }
          - { label: "Hours Column Title", name: "hours_title", widget: "string", required: false, default: "Hours & Days" }
          - label: "Business Hours"
            name: "hours"
            widget: "list"
            required: false
            summary: "{{fields.label}} {{fields.hours}}"
            fields:
              - { label: "Days (e.g. Monday - Friday:)", name: "label", widget: "string" }
              - { label: "Hours (e.g. 9:00 AM - 6:00 PM)", name: "hours", widget: "string" }
              - { label: "Highlight in Accent Color (e.g. Closed days)", name: "highlight", widget: "boolean", default: false, required: false }
          - { label: "Contact Column Title", name: "contact_title", widget: "string", required: false, default: "Contact & Location" }
          - { label: "Address", name: "address", widget: "string", required: false }
          - { label: "Phone (empty = use main phone from Global Site Settings)", name: "phone", widget: "string", required: false }
          - { label: "Email Address", name: "email", widget: "string", required: false }
          - { label: "Show Highlight Box Under Contact", name: "show_tag", widget: "boolean", default: true, required: false }
          - { label: "Highlight Box Icon (FontAwesome class)", name: "tag_icon", widget: "string", required: false, default: "fa-solid fa-kit-medical" }
          - { label: "Highlight Box Text", name: "tag_text", widget: "string", required: false, default: "Urgent Matting Care Available" }
          - { label: "Highlight Box Background", name: "tag_bg_color", widget: "color", allowInput: true, required: false, default: "#7F5539" }
          - { label: "Highlight Box Text Color", name: "tag_text_color", widget: "color", allowInput: true, required: false, default: "#FCD34D" }
          - { label: "Highlight Box Border Color", name: "tag_border_color", widget: "color", allowInput: true, required: false, default: "#9C6F44" }
          - { label: "Copyright Text ({year} and {site} are filled in automatically)", name: "copyright_text", widget: "string", required: false, default: "© {year} {site}. All rights reserved." }
          - { label: "Show Bottom Links on the Site (Privacy, Terms, etc.)", name: "show_legal_links", widget: "boolean", default: false, required: false }
          - label: "Bottom Links (Privacy, Terms, etc.)"
            name: "legal_links"
            widget: "list"
            required: false
            summary: "{{fields.label}}"
            fields:
              - { label: "Link Text", name: "label", widget: "string" }
              - { label: "Link (page URL or #section)", name: "link", widget: "string" }

  # ==========================================
  # 2. GROOMING PACKAGES & SERVICES
  # ==========================================
  - name: "services"
    label: "Grooming Services"
    delete: false
    files:
      - file: "content/services.json"
        label: "Grooming Packages"
        name: "services_list"
        fields:
          - label: "Packages"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Package Title", name: "title", widget: "string" }
              - { label: "Featured Tag (Optional)", name: "badge", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Base Starting Price ($)", name: "base_price", widget: "number", value_type: "int" }
              - { label: "Pricing Note", name: "price_note", widget: "string", default: "/ starting rate" }
              - { label: "Icon FontAwesome Class", name: "icon_class", widget: "string", default: "fa-solid fa-shower" }
              - label: "Included Features List"
                name: "features"
                widget: "list"
                field: { label: "Feature", name: "feature_text", widget: "string" }

  # ==========================================
  # 3. ESTIMATOR SURCHARGES & ADD-ONS
  # ==========================================
  - name: "estimator"
    label: "Estimator Surcharges & Rates"
    delete: false
    files:
      - file: "content/estimator.json"
        label: "Pricing Calculator Rules"
        name: "calculator_rules"
        fields:
          # Section text & colors
          - label: "Section Text & Colors"
            name: "display"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Small Heading Above Title", name: "eyebrow", widget: "string", required: false, default: "Instant Quote Tool" }
              - { label: "Small Heading Color", name: "eyebrow_color", widget: "color", allowInput: true, required: false }
              - { label: "Title", name: "title", widget: "string", default: "Interactive Grooming Cost Estimator" }
              - { label: "Title Color", name: "title_color", widget: "color", allowInput: true, required: false, default: "#5C3D2E" }
              - { label: "Description", name: "description", widget: "text", required: false }
              - { label: "Description Color", name: "description_color", widget: "color", allowInput: true, required: false, default: "#57534E" }
              - { label: "Section Background Color", name: "section_bg_color", widget: "color", allowInput: true, required: false, default: "#FFFFFF" }
              - { label: "Calculator Panel Background Color", name: "panel_bg_color", widget: "color", allowInput: true, required: false, default: "#FDFBF7" }
              - { label: "Step 1 Heading (dog size)", name: "size_label", widget: "string", required: false, default: "1. Select Dog Size" }
              - { label: "Step 2 Heading (coat type)", name: "coat_label", widget: "string", required: false, default: "2. Coat Type / Breed Specialty" }
              - { label: "Step 3 Heading (add-ons)", name: "addon_label", widget: "string", required: false, default: "3. Optional Add-On Services" }
              - { label: "Step Heading Color", name: "step_label_color", widget: "color", allowInput: true, required: false, default: "#44403C" }
              - { label: "Price Card Color - Top Left", name: "card_color_top", widget: "color", allowInput: true, required: false, default: "#7F5539" }
              - { label: "Price Card Color - Bottom Right", name: "card_color_bottom", widget: "color", allowInput: true, required: false, default: "#5C3D2E" }
              - { label: "Price Card Text Color", name: "card_text_color", widget: "color", allowInput: true, required: false, default: "#FFFFFF" }
              - { label: "Price Card Small Text Color", name: "card_muted_color", widget: "color", allowInput: true, required: false, default: "#F2EBD9" }
              - { label: "Total Label (e.g. Estimated Total)", name: "total_label", widget: "string", required: false, default: "Estimated Total" }
              - { label: "Total Label Color", name: "total_label_color", widget: "color", allowInput: true, required: false, default: "#E9C46A" }
              - { label: "Currency Symbol", name: "currency_symbol", widget: "string", required: false, default: "$" }
              - { label: "Price Color", name: "price_color", widget: "color", allowInput: true, required: false, default: "#FFFFFF" }
              - { label: "Note Next To Price", name: "price_note", widget: "string", required: false, default: "*base estimate" }
              - { label: "Duration Label", name: "duration_label", widget: "string", required: false, default: "Est. Duration:" }
              - { label: "Included Label", name: "included_label", widget: "string", required: false, default: "Included:" }
              - { label: "Included Text", name: "included_text", widget: "string", required: false, default: "Nails, Ears & Warm Bath" }
              - { label: "Included Text Color", name: "included_color", widget: "color", allowInput: true, required: false, default: "#FCD34D" }
              - { label: "Book Button Text", name: "button_text", widget: "string", required: false, default: "Book This Custom Estimate" }
              - { label: "Book Button Color", name: "button_color", widget: "color", allowInput: true, required: false, default: "#F4A261" }
              - { label: "Book Button Text Color", name: "button_text_color", widget: "color", allowInput: true, required: false, default: "#1C1917" }
              - { label: "Small Print Under Button", name: "disclaimer", widget: "string", required: false, default: "Final pricing confirmed upon physical coat inspection." }
          # Dog Size Pricing Rules
          - label: "Dog Size Base Rates"
            name: "sizes"
            widget: "list"
            fields:
              - { label: "Size Name", name: "name", widget: "string" } # Small, Medium, Large, X-Large
              - { label: "Weight Range Label", name: "label", widget: "string" } # e.g., Under 20 lbs
              - { label: "Base Price ($)", name: "price", widget: "number", value_type: "int" }
              - { label: "Estimated Duration", name: "duration", widget: "string" } # e.g., 1.5 hrs
              - { label: "Icon (FontAwesome class, optional)", name: "icon", widget: "string", required: false, hint: "e.g. fa-dog or fa-shield-dog" }

          # Coat Type Surcharges (Including Poodle/Doodle +$20 rule)
          - label: "Coat Type Surcharges"
            name: "coats"
            widget: "list"
            fields:
              - { label: "Coat ID", name: "id", widget: "string" } # e.g. doodle, short, medium, long
              - { label: "Coat Label", name: "name", widget: "string" } # e.g. Poodle / Doodle
              - { label: "Surcharge Amount ($)", name: "extra_cost", widget: "number", value_type: "int", default: 20 }
              - { label: "Highlight Badge", name: "badge", widget: "string", required: false, default: "+ $20" }
              - { label: "Badge Color", name: "badge_color", widget: "color", allowInput: true, required: false, default: "#E9C46A" }
              - { label: "Badge Text Color", name: "badge_text_color", widget: "color", allowInput: true, required: false, default: "#1C1917" }

          # Optional Add-on Services
          - label: "Optional Add-on Treats"
            name: "addons"
            widget: "list"
            fields:
              - { label: "Addon Name", name: "title", widget: "string" } # e.g. De-shedding Treatment
              - { label: "Price ($)", name: "price", widget: "number", value_type: "int" }

  # ==========================================
  # 4. BEFORE & AFTER GALLERY
  # ==========================================
  - name: "gallery"
    label: "Pups Before & After Gallery"
    delete: false
    files:
      - file: "content/gallery.json"
        label: "Gallery Pups"
        name: "gallery_list"
        fields:
          - label: "Pups"
            name: "items"
            widget: "list"
            summary: "{{fields.pup_name}}"
            fields:
              - { label: "Pup Name", name: "pup_name", widget: "string" }
              - { label: "Breed & Treatment Tag", name: "details", widget: "string", default: "Goldendoodle • Full Groom" }
              - { label: "Before Image", name: "image_before", widget: "image" }
              - { label: "After Image", name: "image_after", widget: "image" }

  # ==========================================
  # 5. REVIEWS & TESTIMONIALS
  # ==========================================
  - name: "reviews"
    label: "Customer Reviews"
    delete: false
    files:
      - file: "content/reviews.json"
        label: "Reviews"
        name: "reviews_list"
        fields:
          - label: "Reviews"
            name: "items"
            widget: "list"
            summary: "{{fields.owner_name}}"
            fields:
              - { label: "Owner Name", name: "owner_name", widget: "string" }
              - { label: "Pet Name & Breed", name: "pet_info", widget: "string" }
              - { label: "Rating Stars (1 to 5)", name: "rating", widget: "number", value_type: "int", min: 1, max: 5, default: 5 }
              - { label: "Review Quote", name: "review_text", widget: "text" }

  # ==========================================
  # 6. ABOUT US & PHILOSOPHY
  # ==========================================
  - name: "about"
    label: "About Us & Philosophy"
    delete: false
    files:
      - file: "content/about.json"
        label: "About Page Content"
        name: "about_content"
        fields:
          - { label: "Section Heading", name: "heading", widget: "string" }
          - { label: "Main Story / Bio", name: "bio", widget: "markdown" }
          - label: "Core Principles"
            name: "principles"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }
              - { label: "Icon Class", name: "icon", widget: "string" }
